name: Build data entry

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CACHE_DATA_REPO_DIR: ss-data
  RESTORE_DATA_REPO_KEY_PREFIX: ss-data-repo-

jobs:
  prepare-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          
      - name: Clone data repo
        run: |
          TARGET_REPO="${{ env.CACHE_DATA_REPO_DIR }}"
          rm -rf "$TARGET_REPO" || true
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/MakoStar/ss-data.git "$TARGET_REPO"
          
          rm -rf "$TARGET_REPO/.git"
          rm -f "$TARGET_REPO/LICENSE" "$TARGET_REPO/README.md"
          
          echo "Final pure data contents:"
          ls -la "$TARGET_REPO"
        shell: bash

      - name: Check if data exists
        id: check_data
        run: |
          TARGET_REPO="${{ env.CACHE_DATA_REPO_DIR }}"
          if [ -d "$TARGET_REPO" ] && [ -n "$(ls -A "$TARGET_REPO" 2>/dev/null)" ]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
            echo "Data directory has content"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "Data directory is empty or missing, skipping cache save"
          fi
        shell: bash

      - name: Save data cache
        if: steps.check_data.outputs.valid == 'true'
        uses: actions/cache/save@v6
        with:
          path: "${{ env.CACHE_DATA_REPO_DIR }}"
          key: "${{ env.RESTORE_DATA_REPO_KEY_PREFIX }}${{ hashFiles(env.CACHE_DATA_REPO_DIR) }}"

      # - name: Trigger workflow
      #   if: steps.check_data.outputs.valid == 'true'
